<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" viewBox="0 0 440 220" width="440" height="220">
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --border: #d0d7de;
      --text: #24292f;
      --muted: #57606a;
      --accent: #0969da;
      --dot-red: #ff5f56;
      --dot-yellow: #ffbd2e;
      --dot-green: #27c93f;
      --prompt-user: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --muted: #8b949e;
        --accent: #58a6ff;
        --prompt-user: #3fb950;
      }
    }
    .term {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      width: 440px;
      height: 220px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      font-family: ui-monospace, "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, monospace;
      color: var(--text);
    }
    .titlebar {
      flex: 0 0 30px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.r { background: var(--dot-red); }
    .dot.y { background: var(--dot-yellow); }
    .dot.g { background: var(--dot-green); }
    .titletext {
      margin: 0 auto;
      font-size: 11px;
      color: var(--muted);
      transform: translateX(-16px);
    }
    .body {
      flex: 1 1 auto;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 26px;
    }
    .xmark { flex: 0 0 auto; width: 56px; height: 56px; }
    .xmark path { fill: var(--text); }
    .info { min-width: 0; }
    .prompt { font-size: 12px; margin-bottom: 8px; white-space: nowrap; }
    .p-user { color: var(--prompt-user); font-weight: 700; }
    .p-sym { color: var(--muted); margin: 0 2px; }
    .p-cmd { color: var(--text); font-weight: 700; }
    .cursor { display: inline-block; width: 6px; height: 13px; background: var(--text); margin-left: 4px; vertical-align: -2px; opacity: 0.85; }
    .handle { font-size: 20px; font-weight: 700; }
    .url { font-size: 13px; color: var(--accent); margin-top: 4px; }
  </style>
  <foreignObject width="100%" height="100%">
    <xhtml:div class="term">
      <xhtml:div class="titlebar">
        <xhtml:div class="dot r"></xhtml:div>
        <xhtml:div class="dot y"></xhtml:div>
        <xhtml:div class="dot g"></xhtml:div>
        <xhtml:div class="titletext">fuyuu57577@github — jump2x</xhtml:div>
      </xhtml:div>
      <xhtml:div class="body">
        <svg class="xmark" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        <xhtml:div class="info">
          <xhtml:div class="prompt"><xhtml:span class="p-user">fuyuu57577</xhtml:span><xhtml:span class="p-sym">@</xhtml:span><xhtml:span class="p-cmd">github</xhtml:span> <xhtml:span class="p-sym">$</xhtml:span> <xhtml:span class="p-cmd">jump2x</xhtml:span></xhtml:div>
          <xhtml:div class="handle">@fuyuu575</xhtml:div>
          <xhtml:div class="url">x.com/fuyuu575</xhtml:div>
        </xhtml:div>
      </xhtml:div>
    </xhtml:div>
  </foreignObject>
</svg>
