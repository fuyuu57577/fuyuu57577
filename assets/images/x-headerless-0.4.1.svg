<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" viewBox="0 0 880 130" width="880" height="130">
  <style>
    :root {
      --bg: #ffffff;
      --border: #d0d7de;
      --text: #24292f;
      --muted: #57606a;
      --accent: #0969da;
      --prompt-user: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --border: #30363d;
        --text: #c9d1d9;
        --muted: #8b949e;
        --accent: #58a6ff;
        --prompt-user: #3fb950;
      }
    }
    .term {
      position: relative;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      width: 880px;
      height: 130px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      font-family: ui-monospace, "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, monospace;
      color: var(--text);
    }
    .promptbar { flex: 0 0 auto; box-sizing: border-box; padding: 14px 32px 0 32px; }
    .body {
      flex: 1 1 auto;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 32px;
    }
    .icon { flex: 0 0 auto; width: 44px; height: 44px; color: var(--text); }
    .info { min-width: 0; }
    .prompt { font-size: 12px; white-space: nowrap; }
    .p-user { color: var(--prompt-user); font-weight: 700; }
    .p-sym { color: var(--muted); margin: 0 2px; }
    .p-cmd { color: var(--text); font-weight: 700; }
    .handle { font-size: 19px; font-weight: 700; }
    .url { font-size: 12px; color: var(--accent); margin-top: 3px; }
    .goto {
      position: absolute;
      right: 16px;
      bottom: 12px;
      width: 20px;
      height: 20px;
      color: var(--muted);
      opacity: 0.75;
    }
    .goto path, .goto polyline, .goto line { stroke: currentColor; }
  </style>
  <foreignObject width="100%" height="100%">
    <xhtml:div class="term">
      <xhtml:div class="promptbar">
        <xhtml:div class="prompt"><xhtml:span class="p-user">fuyuu57577</xhtml:span><xhtml:span class="p-sym">@</xhtml:span><xhtml:span class="p-cmd">github</xhtml:span> <xhtml:span class="p-sym">$</xhtml:span> <xhtml:span class="p-cmd">jump2x</xhtml:span></xhtml:div>
      </xhtml:div>
      <xhtml:div class="body">
        <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        <xhtml:div class="info">
          <xhtml:div class="handle">@fuyuu575</xhtml:div>
          <xhtml:div class="url">x.com/fuyuu575</xhtml:div>
        </xhtml:div>
      </xhtml:div>
      <svg class="goto" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    </xhtml:div>
  </foreignObject>
</svg>
