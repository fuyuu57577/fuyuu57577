<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" viewBox="0 0 880 411" width="880" height="411">
  <metadata>Copyright (c) 2026 ふゆ &lt;fuyuu575@gmail.com&gt;</metadata>
  <style>
    :root {
  --bg: #ffffff;
  --panel: #f6f8fa;
  --border: #d0d7de;
  --text: #24292f;
  --muted: #57606a;
  --accent: #0969da;
  --accent2: #8250df;
  --dot-red: #ff5f56;
  --dot-yellow: #ffbd2e;
  --dot-green: #27c93f;
  --prompt-user: #1a7f37;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #d2a8ff;
    --prompt-user: #3fb950;
  }
}
.term {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  font-family: ui-monospace, "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, monospace;
  color: var(--text);
}
.titlebar {
  flex: 0 0 34px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.r { background: var(--dot-red); }
.dot.y { background: var(--dot-yellow); }
.dot.g { background: var(--dot-green); }
.titletext { margin: 0 auto; font-size: 12px; color: var(--muted); transform: translateX(-18px); }
.promptbar { flex: 0 0 auto; box-sizing: border-box; padding: 14px 32px 0 32px; }
.prompt { font-size: 12px; white-space: nowrap; }
.p-user { color: var(--prompt-user); font-weight: 700; }
.p-sym { color: var(--muted); margin: 0 2px; }
.p-cmd { color: var(--text); font-weight: 700; }

    :root { --drink: #2f6fb0; --drink-accent: #7ec8f5; }
    @media (prefers-color-scheme: dark) {
      :root { --drink: #5ea1e8; --drink-accent: #a9dcff; }
    }
    .term { width: 880px; height: 411px; }
    .body { flex: 1 1 auto; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 12px 60px 22px 60px; }
    .term.mobile .body { padding: 12px 22px 18px 22px; gap: 14px; }
    .columns { display: flex; width: 100%; gap: 60px; }
    .term.mobile .columns { flex-direction: column; gap: 14px; }
    .col { flex: 1 1 0; min-width: 0; }
    .col-title { font-size: 14px; color: var(--accent); font-weight: 700; margin: 0 0 8px 0; }
    .col ul { list-style: none; margin: 0; padding: 0; font-size: 14px; line-height: 1.9; }
    .col li { color: var(--text); }
    .col li b { color: var(--accent2); font-weight: 700; }
    .bullet { color: var(--muted); margin-right: 6px; }
    .divider { flex: 0 0 auto; height: 1px; background: var(--border); width: 100%; }
    .coffee-row { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .aa {
      flex: 0 0 auto;
      margin: 0;
      font-size: 13px;
      line-height: 1.28;
      color: var(--drink);
      white-space: pre;
    }
    .aa .accent { color: var(--drink-accent); }
    .aa .mirror { display: inline-block; transform: scaleX(-1); }
    .caption { font-size: 14px; color: var(--muted); font-style: italic; white-space: nowrap; }
    .coffee-title { align-self: flex-start; font-size: 14px; color: var(--accent); font-weight: 700; margin: 0; }
    .coffee-title .drink-name { color: var(--muted); font-weight: 400; }
  </style>
  <foreignObject width="100%" height="100%">
    <xhtml:div class="term">
      <xhtml:div class="promptbar">
        <xhtml:div class="prompt"><xhtml:span class="p-user">fuyuu57577</xhtml:span><xhtml:span class="p-sym">@</xhtml:span><xhtml:span class="p-cmd">github</xhtml:span> <xhtml:span class="p-sym">$</xhtml:span> <xhtml:span class="p-cmd">now</xhtml:span></xhtml:div>
      </xhtml:div>
      <xhtml:div class="body">
        <xhtml:div class="columns">
                    <xhtml:div class="col">
            <xhtml:p class="col-title">Interests</xhtml:p>
            <xhtml:ul>
              <xhtml:li><xhtml:span class="bullet">-</xhtml:span><xhtml:b>Artificial Life</xhtml:b></xhtml:li>
              <xhtml:li><xhtml:span class="bullet">-</xhtml:span><xhtml:b>AI</xhtml:b></xhtml:li>
              <xhtml:li><xhtml:span class="bullet">-</xhtml:span><xhtml:b>Architecture</xhtml:b></xhtml:li>
            </xhtml:ul>
          </xhtml:div>
          <xhtml:div class="col">
            <xhtml:p class="col-title">Building</xhtml:p>
            <xhtml:ul>
              <xhtml:li><xhtml:span class="bullet">-</xhtml:span><xhtml:b>Portfolio</xhtml:b></xhtml:li>
              <xhtml:li><xhtml:span class="bullet">-</xhtml:span><xhtml:b>Pond</xhtml:b></xhtml:li>
            </xhtml:ul>
          </xhtml:div>
        </xhtml:div>
        <xhtml:div class="divider"></xhtml:div>
        <xhtml:div class="coffee-row">
          <xhtml:p class="coffee-title">A drink to match my mood <xhtml:span class="drink-name">・ramune</xhtml:span></xhtml:p>
          <xhtml:pre class="aa">      __
     |  |
    /    <xhtml:span class="mirror">/</xhtml:span>
    <xhtml:span class="mirror">/</xhtml:span> <xhtml:span class="accent">◯</xhtml:span> /
    /~~~~<xhtml:span class="mirror">/</xhtml:span>
  　|   <xhtml:span class="accent">o</xhtml:span> |
  　| <xhtml:span class="accent">゜。</xhtml:span>|
  　|<xhtml:span class="accent">。  .</xhtml:span>|
  　`-___-'</xhtml:pre>
<xhtml:div class="caption">Perfect for a hot day.</xhtml:div>
        </xhtml:div>
      </xhtml:div>
    </xhtml:div>
  </foreignObject>
</svg>
