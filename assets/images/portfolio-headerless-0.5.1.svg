<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" viewBox="0 0 880 130" width="880" height="130">
  <style>
    :root {
  --bg: #ffffff;
  --panel: #f6f8fa;
  --border: #d0d7de;
  --text: #24292f;
  --muted: #57606a;
  --accent: #0969da;
  --accent2: #8250df;
  --dot-red: #ff5f56;
  --dot-yellow: #ffbd2e;
  --dot-green: #27c93f;
  --prompt-user: #1a7f37;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #d2a8ff;
    --prompt-user: #3fb950;
  }
}
.term {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  font-family: ui-monospace, "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, monospace;
  color: var(--text);
}
.titlebar {
  flex: 0 0 34px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.r { background: var(--dot-red); }
.dot.y { background: var(--dot-yellow); }
.dot.g { background: var(--dot-green); }
.titletext { margin: 0 auto; font-size: 12px; color: var(--muted); transform: translateX(-18px); }
.promptbar { flex: 0 0 auto; box-sizing: border-box; padding: 14px 32px 0 32px; }
.prompt { font-size: 12px; white-space: nowrap; }
.p-user { color: var(--prompt-user); font-weight: 700; }
.p-sym { color: var(--muted); margin: 0 2px; }
.p-cmd { color: var(--text); font-weight: 700; }

    .term { position: relative; width: 880px; height: 130px; }
    .body {
      flex: 1 1 auto;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 32px;
    }
    .term.mobile .body { gap: 16px; padding: 0 20px; }
    .icon { flex: 0 0 auto; width: 44px; height: 44px; color: var(--text); }
    .term.mobile .icon { width: 36px; height: 36px; }
    .info { min-width: 0; }
    .handle { font-size: 19px; font-weight: 700; }
    .term.mobile .handle { font-size: 17px; }
    .url { font-size: 12px; color: var(--accent); margin-top: 3px; }
    .goto {
      position: absolute;
      right: 16px;
      bottom: 12px;
      width: 20px;
      height: 20px;
      color: var(--muted);
      opacity: 0.75;
    }
    .term.mobile .goto { right: 12px; bottom: 10px; width: 16px; height: 16px; }
    .goto path, .goto polyline, .goto line { stroke: currentColor; }
  </style>
  <foreignObject width="100%" height="100%">
    <xhtml:div class="term">
      <xhtml:div class="promptbar">
        <xhtml:div class="prompt"><xhtml:span class="p-user">fuyuu57577</xhtml:span><xhtml:span class="p-sym">@</xhtml:span><xhtml:span class="p-cmd">github</xhtml:span> <xhtml:span class="p-sym">$</xhtml:span> <xhtml:span class="p-cmd">jump2portfolio</xhtml:span></xhtml:div>
      </xhtml:div>
      <xhtml:div class="body">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <line x1="2" y1="12" x2="22" y2="12"/>
  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
</svg>
        <xhtml:div class="info">
          <xhtml:div class="handle">Portfolio</xhtml:div>
          <xhtml:div class="url">fuyuu575.com</xhtml:div>
        </xhtml:div>
      </xhtml:div>
      <svg class="goto" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    </xhtml:div>
  </foreignObject>
</svg>
